<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quorum Mandala Generator</title>
    
    <!-- Preload Nunito font -->
    <link rel="preload" href="./assets/fonts/nunito-900.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- Styles -->
    <link rel="stylesheet" href="./assets/css/styles.css">
    
    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <!-- Scripts -->
    <script src="./assets/js/utils.js"></script>
    <script src="./assets/js/mandala-generator.js"></script>
    <script src="./assets/js/png-export.js"></script>
    <script src="./components/avatar-creator.js"></script>
    
    <script type="text/babel">
        // Initialize the app with comprehensive error checking
        const { useState, useEffect } = React;
        
        // Wait for all modules to load
        window.addEventListener('load', () => {
            setTimeout(() => {
                // Check if all required modules are loaded
                const missingModules = [];
                if (!window.MandalaUtils) missingModules.push('MandalaUtils');
                if (!window.MandalaGenerator) missingModules.push('MandalaGenerator');
                if (!window.ExportUtils) missingModules.push('ExportUtils');
                if (!window.AvatarCreator) missingModules.push('AvatarCreator');
                
                if (missingModules.length > 0) {
                    console.error('Missing modules:', missingModules);
                    document.getElementById('root').innerHTML = `
                        <div style="padding: 2rem; color: red; font-family: system-ui;">
                            <h2>Error: Application failed to load</h2>
                            <p>Missing modules: ${missingModules.join(', ')}</p>
                            <p>Please check the console for more details.</p>
                        </div>
                    `;
                    return;
                }
                
                console.log('All modules loaded successfully');
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(window.AvatarCreator));
            }, 200); // Increased delay to ensure all scripts are processed
        });
    </script>
</body>
</html>
